aid: halifax
url: https://raw.githubusercontent.com/api-evangelist/halifax/refs/heads/main/apis.yml
name: Halifax
kind: company
description: >-
  Halifax is a major British high-street banking brand serving personal and
  business customers with current accounts, savings, mortgages, credit cards,
  loans, and insurance. It operates as a trading division of Bank of Scotland
  plc, a wholly owned subsidiary of Lloyds Banking Group, and is authorised by
  the Prudential Regulation Authority and regulated by the Financial Conduct
  Authority and the PRA. As one of the UK Open Banking CMA9 mandated ASPSPs,
  Halifax publishes the full Open Banking Implementation Entity (OBIE) API
  surface: a set of PUBLIC, unauthenticated Open Data APIs (ATM and branch
  locators plus personal current account, business current account, unsecured
  SME loan, and commercial credit card product reference data) served live at
  api.halifax.co.uk, and the FAPI-secured OBIE Read/Write APIs for Account and
  Transaction Information (AIS), Payment Initiation (PIS), and Confirmation of
  Funds (CBPII). Read/Write access is delivered through the shared Lloyds
  Banking Group Developer Portal that also covers the Lloyds Bank and Bank of
  Scotland brands, secured with OAuth2/OIDC, PSD2 strong customer
  authentication, mutual-TLS, and OBIE/eIDAS certificates.
