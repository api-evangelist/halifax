  name: Halifax Account and Transaction Information API (AIS)
  description: >-
    OBIE Read/Write Account and Transaction Information (AIS) API for authorised AISPs. FAPI-secured (OAuth2/OIDC,
    PSD2 SCA, mTLS, OBIE/eIDAS certificates); onboarded via the Lloyds Banking Group Developer Portal.
    Base path follows the OBIE Read/Write v3.1 standard on the confirmed api.halifax.co.uk host; not independently
    verified (authentication-gated).
  humanURL: https://developer.lloydsbanking.com/prod01/lbg/read-write
