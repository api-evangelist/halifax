    access: >-
      Free with registration in the Open Banking Directory; grants read/write
      access to the Sandbox Read/Write APIs.
    guide: https://developer.lloydsbanking.com/prod01/lbg/lbg-support/sandbox-guide
    replicates_production: true
  - name: production
    purpose: Live AIS/PIS/CBPII once TPP is fully onboarded and certified.
    access: Requires OB Directory onboarding + OBIE/eIDAS certificates + Lloyds portal enrolment.
test_data:
